# Deploys the site to GitHub Pages on every push to master, stamping the commit
# into the module URLs first. Browsers cache ES modules per URL, so "?v=dev" in
# the source becomes "?v=<commit>" at deploy time and every file of a build is
# fetched together — no stale ledger.js under a fresh app.js, and no build number
# to bump by hand. The login card shows the same stamp.
name: pages
on:
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Stamp the commit into module URLs and the build label
        run: |
          sha=$(git rev-parse --short=7 HEAD)
          sed -i "s/?v=dev/?v=$sha/g; s/build dev/build $sha/g" index.html *.js
          grep -c "$sha" index.html app.js
      # One file instead of ~30: a phone on a slow connection spent most of sign-in fetching
      # the modules one by one. The source stays as modules (the tests load them that way);
      # only what's deployed is bundled. esbuild ignores the ?v= on each import.
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Bundle the app into app.js
        run: |
          npx --yes esbuild@0.28.2 app.js --bundle --format=esm --minify --target=es2019 --outfile=app.bundle.js --log-level=warning
          mv app.bundle.js app.js
          head -c 200 app.js; echo; wc -c app.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deploy
        uses: actions/deploy-pages@v4
